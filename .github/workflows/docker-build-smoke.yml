name: 'Docker Build Smoke Test'

# Verifies the full Docker build chain works without any caching.
# Catches native module compilation failures (e.g., isolated-vm, sqlite3)
# that layer caching can mask in the regular E2E pipeline.
#
# Full chain: pnpm install → pnpm build (no Turbo cache) →
#             build base image (no Docker cache) →
#             build n8n + runners images (no Docker cache)

env:
  # Also build the distroless runners image and exec-check
  # both runners images' interpreters, so a broken runtime assembly (e.g. a
  # missing shared library after a Node bump) fails at PR time. The smoke
  # script derives the images to check from this same flag.
  DOCKER_BUILD_DISTROLESS: 'true'
  # Also build the Debian (glibc) n8n and runners images and run the checks on them.
  DOCKER_BUILD_DEBIAN: 'true'

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC, after the nightly Docker build at midnight
  pull_request:
    paths:
      - 'docker/docker-bake.hcl'
      - 'docker/images/n8n/**'
      - 'docker/images/n8n-base/**'
      - 'docker/images/runners/**'
      - 'packages/nodes-base/package.json'
      - 'scripts/build-n8n.mjs'
      - 'scripts/dockerize-n8n.mjs'
      - 'scripts/smoke-n8n-image.mjs'
      - 'package.json'
      - '.github/scripts/docker/edit-image-native-smoke-check.mjs'
      - '.github/scripts/docker/kafka-native-smoke-check.mjs'
      - '.github/scripts/docker/native-addons-smoke-check.mjs'
      - '.github/scripts/docker/should-smoke-build.mjs'
      # These drive the build and the image distribution, so a change here can
      # break the chain without touching a Dockerfile.
      - '.github/actions/build-n8n-docker/action.yml'
      - '.github/actions/load-n8n-docker/action.yml'
      - '.github/actions/setup-nodejs/action.yml'
      - '.github/workflows/docker-build-push.yml'
      - 'patches/**'
      # Pins the native deps this build compiles, but changes far more often
      # than they do — the gate job narrows it to the pins that matter.
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 'Check for relevant changes'
    if: >-
      github.event_name != 'pull_request' || !(
        github.event.pull_request.user.login == 'n8n-assistant[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'release-pr/') &&
        startsWith(github.event.pull_request.base.ref, 'release/')
      )
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD is the PR merge commit, so HEAD^1 is the base tip.
          fetch-depth: 2

      - id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != 'pull_request' ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
          node .github/scripts/docker/should-smoke-build.mjs \
            --base HEAD^1 --changed-files "$RUNNER_TEMP/changed-files"

  docker-smoke-test:
    name: 'Docker Build (no cache, ${{ matrix.platform }})'
    # Both architectures build natively: the runtime images assemble binaries
    # across images with arch-specific paths (e.g. the ELF interpreter lives at
    # /lib/ld-linux-aarch64.so.1 only on arm64), so amd64 alone can miss
    # arm64-only runtime breaks.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: gate
    if: ${{ !github.event.pull_request.head.repo.fork && needs.gate.outputs.build == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to DHI Registry (for base image)
        if: github.repository == 'n8n-io/n8n'
        uses: ./.github/actions/docker-registry-login
        with:
          login-ghcr: 'false'
          login-dhi: 'true'
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      # docker-bake.hcl holds the Node version of the images. The host uses
      # the same one, because the images copy native bindings from this build.
      - name: Read the Node version
        if: github.repository == 'n8n-io/n8n'
        id: node
        run: |
          version=$(sed -nE 's/^variable "NODE_VERSION" \{ default = "([^"]+)" \}$/\1/p' docker/docker-bake.hcl)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build full chain (no cache)
        if: github.repository == 'n8n-io/n8n'
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ steps.node.outputs.version }}
          build-command: 'pnpm build:docker:clean'
          enable-docker-cache: true
          # Use a separate key. This job builds with --no-cache. A shared key
          # would write an empty snapshot over the release layers.
          docker-cache-key: docker-smoke

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: github.repository == 'n8n-io/n8n'

      - id: cloud-token
        if: github.repository == 'n8n-io/n8n'
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
          owner: n8n-io
          repositories: n8n-cloud

      - name: Verify image against live n8n-cloud helm chart
        if: github.repository == 'n8n-io/n8n'
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
        run: pnpm build:docker:smoke

      # n8n-cloud does not deploy the Debian images, so skip the chart patterns.
      - name: Verify the Debian n8n and runners images
        if: github.repository == 'n8n-io/n8n'
        env:
          SMOKE_IMAGE: n8nio/n8n:local-debian
          SMOKE_RUNNERS_IMAGES: n8nio/runners:local-debian
          SMOKE_SKIP_CLOUD: 'true'
        run: pnpm build:docker:smoke

      # Standalone builds use the local source image. They need no DHI login,
      # publishing credentials, private app token, or n8n-cloud checkout.
      - name: Set up the standalone Docker builder
        if: github.repository != 'n8n-io/n8n'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Check standalone build resources
        if: github.repository != 'n8n-io/n8n'
        run: |
          nproc
          free -h
          df -h
          # These SDKs are unused on this disposable GitHub-hosted runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
          docker compose version
          docker compose -f docker/compose.local.yml config --quiet
          docker buildx build --check --file docker/images/n8n/Dockerfile.local .

      - name: Build the standalone source image without cache
        if: github.repository != 'n8n-io/n8n'
        run: |
          set -euo pipefail
          docker compose --progress plain -f docker/compose.local.yml build --no-cache \
            2>&1 | tee "$RUNNER_TEMP/standalone-docker-build.log"

      - name: Verify standalone application readiness
        if: github.repository != 'n8n-io/n8n'
        run: |
          set -euo pipefail
          docker compose -f docker/compose.local.yml up -d --no-build --wait --wait-timeout 240
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            --connect-timeout 5 --max-time 10 \
            http://127.0.0.1:5678/healthz/readiness > "$RUNNER_TEMP/standalone-readiness.json"
          curl --fail --silent --show-error \
            http://127.0.0.1:5678/rest/settings > "$RUNNER_TEMP/standalone-settings.json"
          curl --fail --silent --show-error \
            http://127.0.0.1:5678/ > "$RUNNER_TEMP/standalone-index.html"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          readiness = json.loads((root / 'standalone-readiness.json').read_text())
          assert readiness.get('status') == 'ok', readiness
          settings = json.loads((root / 'standalone-settings.json').read_text())
          data = settings.get('data')
          assert isinstance(data, dict), 'Settings response has no data object'
          assert data.get('settingsMode') == 'public', 'Public settings were not returned'
          assert isinstance(data.get('userManagement'), dict), 'User management settings are missing'
          html = (root / 'standalone-index.html').read_text().lower()
          assert '<html' in html and 'id="app"' in html, 'The editor HTML is missing'
          print('Application readiness, public settings, and editor HTML passed.')
          PYTHON

      - name: Verify standalone native modules
        if: github.repository != 'n8n-io/n8n'
        run: |
          docker compose -f docker/compose.local.yml exec -T n8n node --input-type=module \
            < .github/scripts/docker/native-addons-smoke-check.mjs
          docker compose -f docker/compose.local.yml exec -T n8n node --input-type=module \
            < .github/scripts/docker/kafka-native-smoke-check.mjs

      - name: Collect standalone build and application logs
        if: always() && github.repository != 'n8n-io/n8n'
        run: |
          mkdir -p "$RUNNER_TEMP/standalone-docker-logs"
          docker compose -f docker/compose.local.yml ps --all \
            > "$RUNNER_TEMP/standalone-docker-logs/containers.txt" 2>&1 || true
          docker compose -f docker/compose.local.yml logs --no-color \
            > "$RUNNER_TEMP/standalone-docker-logs/application.log" 2>&1 || true
          df -h > "$RUNNER_TEMP/standalone-docker-logs/disk.txt"
          free -h > "$RUNNER_TEMP/standalone-docker-logs/memory.txt"

      - name: Remove standalone test containers and data
        if: always() && github.repository != 'n8n-io/n8n'
        run: docker compose -f docker/compose.local.yml down --volumes --remove-orphans

      - name: Upload standalone Docker logs
        if: always() && github.repository != 'n8n-io/n8n'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: standalone-docker-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/standalone-docker-build.log
            ${{ runner.temp }}/standalone-docker-logs/
          if-no-files-found: ignore
          retention-days: 7

  notify-on-failure:
    name: Notify on nightly smoke test failure
    runs-on: ubuntu-latest
    needs: [docker-smoke-test]
    if: needs.docker-smoke-test.result == 'failure' && github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/slack
          sparse-checkout-cone-mode: false
      - name: Notify Slack
        if: env.SLACK_TOKEN != ''
        env:
          SLACK_TOKEN: ${{ secrets.QBOT_SLACK_TOKEN }}
        run: |
          node .github/scripts/slack/notify.mjs \
            --channel C0A9RLY8Y20 \
            --text '🚨 Nightly Docker smoke test failed (no-cache build) - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
