# Run from the repository root:
# docker compose --env-file .env -f docker/compose.local.yml up --build -d
# Omit --env-file .env if you have not created that file.
name: n8n2
services:
  n8n:
    build:
      context: ..
      dockerfile: docker/images/n8n/Dockerfile.local
    pull_policy: never
    ports:
      - '127.0.0.1:5678:5678'
    environment:
      N8N_DIAGNOSTICS_ENABLED: '${N8N_DIAGNOSTICS_ENABLED:-false}'
      N8N_VERSION_NOTIFICATIONS_ENABLED: '${N8N_VERSION_NOTIFICATIONS_ENABLED:-false}'
      N8N_VERSION_NOTIFICATIONS_WHATS_NEW_ENABLED: '${N8N_VERSION_NOTIFICATIONS_WHATS_NEW_ENABLED:-false}'
      N8N_TEMPLATES_ENABLED: '${N8N_TEMPLATES_ENABLED:-false}'
      N8N_PERSONALIZATION_ENABLED: '${N8N_PERSONALIZATION_ENABLED:-false}'
      N8N_HIRING_BANNER_ENABLED: '${N8N_HIRING_BANNER_ENABLED:-false}'
      N8N_SENTRY_DSN: '${N8N_SENTRY_DSN:-}'
      N8N_FRONTEND_SENTRY_DSN: '${N8N_FRONTEND_SENTRY_DSN:-}'
      GENERIC_TIMEZONE: '${GENERIC_TIMEZONE:-UTC}'
      TZ: '${TZ:-UTC}'
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
volumes:
  n8n-data:
